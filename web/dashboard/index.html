<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Live releases of the mini-deploy platform">
<!-- A backstop on top of textContent: only this site's own files may run or load.
     (Inline styles are allowed; scripts are not.) Set here, not in Caddy, so it does
     not restrict your other apps. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>mini-deploy dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  .app-name { font-size: 1.15rem; }
  .status { display: grid; gap: 0.35rem; justify-items: start; flex: 1 1 12rem; }
  @media (min-width: 560px) { .status { justify-items: end; text-align: right; } }
  .cmd {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem;
    background: rgba(255, 255, 255, 0.7); border-radius: var(--radius-sm);
    padding: 0.5rem 0.5rem 0.5rem 0.9rem;
  }
  .cmd code { flex: 1 1 14rem; overflow-wrap: anywhere; }
  .log-row { padding: 0.55rem 0; border-top: 1px solid rgba(255, 255, 255, 0.14); }
  .log-row:first-child { border-top: 0; }
  .result-ok { color: #9EE3BE; }
  .result-bad { color: #FFB3C9; }
  .empty { padding: 1rem 0; }
</style>
</head>
<body>
<main class="wrap stack">

  <header class="glass row between">
    <div>
      <p class="eyebrow">self-hosted deploys</p>
      <h1 class="brand" style="font-size: clamp(1.5rem, 5vw, 2.1rem)">mini-deploy</h1>
    </div>
    <div class="status">
      <span id="overall" class="chip" data-state="ok">loading</span>
      <p id="attention" class="muted" style="font-size: 0.82rem"></p>
      <p id="updated" class="muted" style="font-size: 0.8rem"></p>
      <p id="logs-link" style="font-size: 0.8rem"></p>
    </div>
  </header>

  <section aria-labelledby="apps-title" class="stack">
    <h2 id="apps-title">Apps</h2>
    <div id="apps" class="grid"></div>
  </section>

  <section aria-labelledby="log-title" class="dark-card">
    <h2 id="log-title">Recent activity</h2>
    <div id="log" aria-live="polite"></div>
  </section>

  <footer class="muted" style="font-size: 0.82rem">
    Read-only. Run the commands yourself from the repo folder. This page is a static
    release served by Caddy, like any other app, and is visible to everyone on this
    network.
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
